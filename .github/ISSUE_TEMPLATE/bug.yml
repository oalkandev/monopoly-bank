name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "for example iPhone 15 with Safari, or Windows 11 with Chrome"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
