<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="12" result="shadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="shadow" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#shine)"/>

  <!-- Coin -->
  <g filter="url(#coinShadow)">
    <circle cx="512" cy="512" r="320" fill="#fef3c7"/>
    <circle cx="512" cy="512" r="320" fill="none" stroke="#fbbf24" stroke-width="14" stroke-opacity="0.6"/>
    <circle cx="512" cy="512" r="290" fill="none" stroke="#d97706" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="4 8"/>
  </g>

  <!-- ₺ glyph: paths so we don't depend on system fonts -->
  <!-- Stem (vertical) -->
  <path d="
    M 480 304
    L 552 304
    L 552 720
    L 480 720
    Z
  " fill="#1e293b"/>
  <!-- Top horizontal cap -->
  <path d="M 384 304 L 656 304 L 656 360 L 384 360 Z" fill="#1e293b"/>
  <!-- Bottom small base -->
  <path d="M 408 668 L 624 668 L 624 720 L 408 720 Z" fill="#1e293b"/>
  <!-- Upper diagonal slash -->
  <path d="
    M 380 460
    L 670 410
    L 680 460
    L 390 510
    Z
  " fill="#1e293b"/>
  <!-- Lower diagonal slash -->
  <path d="
    M 380 540
    L 670 490
    L 680 540
    L 390 590
    Z
  " fill="#1e293b"/>
</svg>
