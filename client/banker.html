<!doctype html>
<html lang="tr" data-theme="monopoly-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monopoly Bank — Bankacı</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('monopoly-theme');
        if (t === 'monopoly-light' || t === 'monopoly-dark') {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/banker.jsx"></script>
</body>
</html>
